name: bapmeokja

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bapmeokja
      MYSQL_USER: bapmeokja
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bapmeokja-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bapmeokja-root-local}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bapmeokja?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: bapmeokja
      DB_PASSWORD: ${MYSQL_PASSWORD:-bapmeokja-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006}
      UPLOAD_DIRECTORY: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      SERVER_PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  mysql-data:
  upload-data:
