spring:
  application:
    name: bapmeokja-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bapmeokja?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:bapmeokja}
    password: ${DB_PASSWORD:bapmeokja}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006}
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-key-to-at-least-32-characters}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
